name: Android APK

# Gera o APK do app (Capacitor) na nuvem, sem precisar do Android Studio.
# Rode em Actions → Android APK → Run workflow e baixe o arquivo em "Artifacts".
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Build do site para o app e sincronização com o projeto Android
        run: npm run build:app

      - name: Gerar o APK (debug, assinado com a chave de depuração)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v6
        with:
          name: upbeats-karaoke-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
