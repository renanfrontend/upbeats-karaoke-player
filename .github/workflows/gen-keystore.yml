name: Gerar chave de depuração (temporário)

on:
  pull_request:
    paths:
      - ".github/workflows/gen-keystore.yml"

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Criar o keystore de depuração
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storetype PKCS12 \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -dname "CN=Android Debug,O=UP BEATS,C=BR"
          keytool -list -keystore debug.keystore -storepass android | tail -3
      - uses: actions/upload-artifact@v6
        with:
          name: debug-keystore
          path: debug.keystore
          if-no-files-found: error
